    <text x="626" y="422" font-size="15" class="muted">Saved in .debug.txt</text>
    <text x="456" y="448" font-size="14" class="muted">Input: [2,2,2,1,2,2,1,2,2,2] | 2    Expected: 16</text>
    <text x="456" y="494" font-size="16" font-weight="700">Open Debug Cases File</text>
    <text x="650" y="494" font-size="15" class="muted">Create or edit custom debug cases</text>
  </g>

  <rect x="1114" y="184" width="244" height="130" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="1136" y="222" font-size="18" font-weight="700" class="blue">Pick a case</text>
  <text x="1136" y="252" font-size="16">Official examples, failed</text>

    <text x="548" y="286" font-size="15" class="muted">Official LeetCode example</text>
    <text x="456" y="312" font-size="14" class="muted">Input: [1,1,2,1,1] | 3    Expected: 2</text>
    <text x="456" y="354" font-size="16" font-weight="700">Example 2</text>

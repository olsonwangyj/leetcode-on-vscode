  <line x1="98" y1="134" x2="1396" y2="134" class="line"/>

  <g class="mono" font-size="18">
    <text x="132" y="184" class="muted">1</text><text x="172" y="184" class="green">/*</text>
    <text x="132" y="222" class="muted">2</text><text x="172" y="222" class="green"> * @lc app=leetcode id=1248 lang=java</text>
    <text x="132" y="260" class="muted">3</text><text x="172" y="260" class="green"> */</text>
    <text x="132" y="326" class="muted">7</text><text x="172" y="326" class="green">// @lc code=start</text>
    <text x="132" y="364" class="muted">8</text><text x="172" y="364" fill="#0000ff">class</text><text x="232" y="364"> Solution {</text>
    <text x="132" y="402" class="muted">9</text><text x="212" y="402" fill="#0000ff">public</text><text x="290" y="402"> int numberOfSubarrays(int[] nums, int k) {</text>
    <text x="132" y="440" class="muted">10</text><text x="272" y="440">}</text>
    <text x="132" y="478" class="muted">11</text><text x="172" y="478">}</text>
    <text x="172" y="534" class="muted">Submit | Test | </text><text x="326" y="534" class="blue" font-weight="700">Debug</text><text x="390" y="534" class="muted"> | GitHub</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="420" y="118" width="650" height="410" rx="10" fill="#ffffff" stroke="#d1d5db"/>
